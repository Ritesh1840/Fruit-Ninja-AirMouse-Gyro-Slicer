<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-status-bar-style" content="black-translucent">
  <title>AirMouse — Katana Sword Controller</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background: #090a10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    /* ─── Top Bar ─── */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      flex-shrink: 0;
      z-index: 10;
      background: rgba(15, 17, 26, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
    }

    .brand-badge {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .connection-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      transition: all 0.3s;
    }

    .connection-badge.connected {
      color: #00e676;
      background: rgba(0, 230, 118, 0.12);
    }

    .status-pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #64748b;
      transition: all 0.3s;
    }

    .connection-badge.connected .status-pulse {
      background: #00e676;
      box-shadow: 0 0 8px #00e676;
    }

    /* ─── Main Controller Container ─── */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 14px 14px;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    /* ─── Gyro Visualizer Card ─── */
    .visualizer-card {
      background: linear-gradient(145deg, #121522, #181c2e);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .vis-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .vis-title {
      font-size: 12px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .vis-values {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 12px;
      color: #00e5ff;
      font-weight: 700;
    }

    .gyro-horizon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(0, 229, 255, 0.3);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .horizon-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: #00e5ff;
      transform-origin: center;
      transition: transform 0.05s linear;
    }

    .crosshair-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff4081;
      position: absolute;
      box-shadow: 0 0 6px #ff4081;
      transition: transform 0.05s linear;
    }

    /* ─── Actions Bar ─── */
    .recenter-bar {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .action-btn {
      flex: 1;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .btn-recenter {
      background: linear-gradient(135deg, #1e293b, #334155);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-play-action {
      background: linear-gradient(135deg, #00e676, #00b0ff);
      color: #000;
    }

    /* ─── Trigger Pad / Touch Area ─── */
    .trigger-pad {
      flex: 1;
      border-radius: 20px;
      background: linear-gradient(160deg, #121422, #0d0f1a);
      border: 2px dashed rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
      transition: border-color 0.2s, background 0.2s;
    }

    .trigger-pad.active-slashing {
      border: 2px solid #ff4081;
      background: radial-gradient(circle at center, rgba(255, 64, 129, 0.25), #0d0f1a 80%);
      box-shadow: 0 0 30px rgba(255, 64, 129, 0.35), inset 0 0 20px rgba(255, 64, 129, 0.2);
    }

    .blade-icon {
      font-size: 44px;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 12px rgba(255, 64, 129, 0.4));
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .trigger-pad.active-slashing .blade-icon {
      transform: scale(1.25) rotate(-15deg);
    }

    .trigger-label {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 4px;
    }

    .trigger-subtext {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      max-width: 240px;
      line-height: 1.4;
    }

    .trigger-pad.active-slashing .trigger-label {
      color: #ff4081;
      text-shadow: 0 0 12px rgba(255, 64, 129, 0.6);
    }

    /* ─── Footer Controls ─── */
    .control-footer {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(18, 20, 32, 0.7);
      border-radius: 16px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .setting-label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 700;
    }

    .segmented-control {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      padding: 2px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .seg-btn {
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .seg-btn.active {
      background: #00e5ff;
      color: #000;
      box-shadow: 0 2px 8px rgba(0, 229, 255, 0.3);
    }

    /* ─── Permission Modal ─── */
    #permissionModal {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 15, 0.96);
      backdrop-filter: blur(16px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }

    #permissionModal.hidden {
      display: none;
    }

    .modal-icon {
      font-size: 64px;
      margin-bottom: 16px;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .modal-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #00e5ff, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .modal-desc {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.6;
      max-width: 290px;
    }

    .grant-btn {
      width: 100%;
      max-width: 280px;
      padding: 16px;
      font-size: 16px;
      font-weight: 900;
      color: #000;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #00e5ff, #00e676);
      box-shadow: 0 6px 24px rgba(0, 229, 255, 0.4);
      cursor: pointer;
      transition: transform 0.15s;
    }

    .grant-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <!-- iOS / Sensor Activation Modal -->
  <div id="permissionModal">
    <div class="modal-icon">🎯</div>
    <h2 class="modal-title">Activate AirMouse Slicer</h2>
    <p class="modal-desc">Tilt & point your phone at the screen to aim, hold your thumb down to slice fruits!</p>
    <button class="grant-btn" id="grantPermissionBtn">START SLICING</button>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand">
      <span>🍉 AirMouse</span>
      <span class="brand-badge" id="modeBadge">Gyro</span>
    </div>
    <div class="connection-badge" id="connBadge">
      <div class="status-pulse"></div>
      <span id="connText">Connecting...</span>
    </div>
  </div>

  <!-- Main Container -->
  <div class="main-container">

    <!-- Gyro Visualizer -->
    <div class="visualizer-card">
      <div class="vis-info">
        <span class="vis-title" id="sensorStatusTitle">Motion Aim</span>
        <span class="vis-values" id="gyroDebug">Tilt: 0° | 0°</span>
      </div>
      <div class="gyro-horizon">
        <div class="horizon-line" id="horizonLine"></div>
        <div class="crosshair-dot" id="crosshairDot"></div>
      </div>
    </div>

    <!-- Actions -->
    <div class="recenter-bar">
      <button class="action-btn btn-recenter" id="recenterBtn">
        <span>🎯</span> Re-Center Aim
      </button>
      <button class="action-btn btn-play-action" id="playBtn">
        <span>▶️</span> Start / Play
      </button>
    </div>

    <!-- Trigger Pad (Hold to slice & Touch Trackpad) -->
    <div class="trigger-pad" id="triggerPad">
      <div class="blade-icon" id="bladeIcon">⚡</div>
      <div class="trigger-label" id="triggerTitle">Hold to Slice</div>
      <div class="trigger-subtext" id="triggerDesc">Aim by tilting your phone. Hold thumb down to slice fruits!</div>
    </div>

    <!-- Settings & Sensitivity -->
    <div class="control-footer">
      <div class="footer-row">
        <span class="setting-label">Mode:</span>
        <div class="segmented-control" id="modeControl">
          <button class="seg-btn active" data-mode="gyro">Gyroscope</button>
          <button class="seg-btn" data-mode="touch">Touchpad</button>
          <button class="seg-btn" data-mode="swing">Swing Katana</button>
        </div>
      </div>
      <div class="footer-row">
        <span class="setting-label">Sensitivity:</span>
        <div class="segmented-control" id="sensControl">
          <button class="seg-btn" data-sens="0.7">Low</button>
          <button class="seg-btn active" data-sens="1.2">Normal</button>
          <button class="seg-btn" data-sens="1.8">Fast</button>
          <button class="seg-btn" data-sens="2.6">Insane</button>
        </div>
      </div>
      <div class="footer-row">
        <span class="setting-label">Pitch Axis:</span>
        <div class="segmented-control" id="invertControl">
          <button class="seg-btn active" data-invert="0">Normal (Up = Up)</button>
          <button class="seg-btn" data-invert="1">Inverted</button>
        </div>
      </div>
    </div>

  </div>

  <!-- PeerJS (WebRTC P2P for Vercel/Cloud Deployments) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- Socket.io (for local Node server) -->
  <script src="/socket.io/socket.io.js" onerror="window.noSocketIo=true"></script>

  <script>
  /* ══════════════════════════════════════════════════════════════
     AIRMOUSE MOBILE GYRO & TOUCH ENGINE
     ══════════════════════════════════════════════════════════════ */

  // DOM Elements
  const connBadge = document.getElementById('connBadge');
  const connText = document.getElementById('connText');
  const permissionModal = document.getElementById('permissionModal');
  const grantPermissionBtn = document.getElementById('grantPermissionBtn');
  const recenterBtn = document.getElementById('recenterBtn');
  const playBtn = document.getElementById('playBtn');
  const triggerPad = document.getElementById('triggerPad');
  const triggerTitle = document.getElementById('triggerTitle');
  const triggerDesc = document.getElementById('triggerDesc');
  const horizonLine = document.getElementById('horizonLine');
  const crosshairDot = document.getElementById('crosshairDot');
  const gyroDebug = document.getElementById('gyroDebug');
  const modeBadge = document.getElementById('modeBadge');

  let isConnected = false;
  let sensorsActive = false;
  let sensorEventCount = 0;

  // Controller modes: 'gyro' | 'touch' | 'swing'
  let currentMode = 'gyro';
  let sensitivityMultiplier = 1.2;
  let isTouching = false;
  let isSlashing = false;

  // Calibration Zero-Offsets
  let centerBeta = 45;
  let centerGamma = 0;
  let centerAlpha = 0;

  // Smoothed Angles
  let currentBeta = 45;
  let currentGamma = 0;
  let currentAlpha = 0;

  // Motion rate & acceleration
  let lastRotRate = { alpha: 0, beta: 0, gamma: 0 };
  let lastAccel = { x: 0, y: 0, z: 0 };
  let lastTouchPos = null;

  function hapticPulse(ms = 20) {
    if (navigator.vibrate) {
      try { navigator.vibrate(ms); } catch (e) {}
    }
  }

  function setConnectedStatus(status) {
    isConnected = status;
    if (status) {
      connBadge.classList.add('connected');
      connText.textContent = 'Connected';
      hapticPulse(40);
    } else {
      connBadge.classList.remove('connected');
      connText.textContent = 'Disconnected';
    }
  }

  // ─── Dual Protocol Transmit (WebRTC DataChannel + Socket.io) ───
  let peerConnection = null;
  let socket = null;

  function sendControllerMsg(msg) {
    // 1. WebRTC DataChannel (Ultra-Low Latency UDP)
    if (peerConnection && peerConnection.open) {
      peerConnection.send(msg);
    }
    // 2. Socket.io
    if (socket && socket.connected) {
      if (msg.type === 'gyro') socket.emit('phone:gyro', msg);
      else if (msg.type === 'touchmove') socket.emit('phone:touchmove', msg);
      else if (msg.type === 'touchstart') socket.emit('phone:touchstart', msg);
      else if (msg.type === 'touchend') socket.emit('phone:touchend', msg);
      else if (msg.type === 'slash_state') socket.emit('phone:slash_state', msg);
      else if (msg.type === 'recenter') socket.emit('phone:recenter', msg);
      else if (msg.type === 'action') socket.emit('phone:action', { type: msg.action });
    }
  }

  // ─── WebRTC PeerJS Setup (Works on Vercel) ───
  const urlParams = new URLSearchParams(window.location.search);
  const targetRoomId = urlParams.get('room') || window.location.hash.replace('#', '');

  if (targetRoomId && typeof Peer !== 'undefined') {
    try {
      const myPeer = new Peer();
      myPeer.on('open', (myId) => {
        console.log('[P2P PeerJS] Connecting to room:', targetRoomId);
        const conn = myPeer.connect(targetRoomId, { reliable: false });
        conn.on('open', () => {
          console.log('[P2P PeerJS] Connected to PC!');
          peerConnection = conn;
          setConnectedStatus(true);
        });
        conn.on('close', () => {
          setConnectedStatus(false);
        });
      });
    } catch (e) {
      console.warn('PeerJS init error:', e);
    }
  }

  // ─── Socket.io Fallback ───
  if (typeof io !== 'undefined') {
    try {
      socket = io();
      socket.on('connect', () => { socket.emit('phone:connect'); });
      socket.on('phone:paired', () => { setConnectedStatus(true); });
      socket.on('disconnect', () => { setConnectedStatus(false); });
    } catch (e) {}
  }

  // ─── Permission & Sensor Initialization ───
  grantPermissionBtn.addEventListener('click', async () => {
    permissionModal.classList.add('hidden');
    hapticPulse(30);
    await requestAndInitSensors();
  });

  async function requestAndInitSensors() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const oriRes = await DeviceOrientationEvent.requestPermission();
        if (typeof DeviceMotionEvent !== 'undefined' &&
            typeof DeviceMotionEvent.requestPermission === 'function') {
          await DeviceMotionEvent.requestPermission();
        }
        if (oriRes === 'granted') {
          attachSensorListeners();
        }
      } catch (err) {
        console.warn('iOS motion permission error:', err);
        attachSensorListeners();
      }
    } else {
      attachSensorListeners();
    }
  }

  let rawBeta = 45;
  let rawGamma = 0;
  let rawAlpha = 0;
  let transmitLoopStarted = false;

  function attachSensorListeners() {
    sensorsActive = true;

    // Listen only to deviceorientation (avoid conflicting duplicate events)
    window.addEventListener('deviceorientation', handleOrientation, true);
    window.addEventListener('devicemotion', handleMotion, true);

    setTimeout(recenterAim, 200);

    if (!transmitLoopStarted) {
      transmitLoopStarted = true;
      requestAnimationFrame(runTransmitLoop);
    }

    setTimeout(() => {
      if (sensorEventCount === 0) {
        gyroDebug.textContent = 'Touch Trackpad';
        document.getElementById('sensorStatusTitle').textContent = 'Touch Mode Active';
      }
    }, 2500);
  }

  // ─── Orientation Event Listener ───
  function handleOrientation(e) {
    if (e.beta === null && e.gamma === null) return;
    sensorEventCount++;
    rawBeta = e.beta !== null ? e.beta : 45;
    rawGamma = e.gamma !== null ? e.gamma : 0;
    rawAlpha = e.alpha !== null ? e.alpha : 0;
  }

  // ─── Continuous 60fps Low-Pass Filtered Transmitter Loop ───
  function runTransmitLoop() {
    if (sensorsActive) {
      // Smooth exponential filter on orientation (eliminates IMU jitter)
      const smoothWeight = 0.35;
      currentBeta += (rawBeta - currentBeta) * smoothWeight;
      currentGamma += (rawGamma - currentGamma) * smoothWeight;
      currentAlpha += (rawAlpha - currentAlpha) * smoothWeight;

      const deltaPitch = currentBeta - centerBeta;
      const deltaRoll = currentGamma - centerGamma;

      // Update mobile HUD visualizer
      horizonLine.style.transform = `rotate(${-deltaRoll}deg)`;
      const clampedPitch = Math.max(-18, Math.min(18, deltaPitch));
      const clampedRoll = Math.max(-18, Math.min(18, deltaRoll));
      crosshairDot.style.transform = `translate(${clampedRoll}px, ${-clampedPitch}px)`;
      gyroDebug.textContent = `P: ${Math.round(deltaPitch)}° | R: ${Math.round(deltaRoll)}°`;

      updateSlashState();

      if (currentMode !== 'touch') {
        sendControllerMsg({
          type: 'gyro',
          deltaPitch,
          deltaRoll,
          rawBeta: currentBeta,
          rawGamma: currentGamma,
          rotRate: lastRotRate,
          isSlashing,
          sensitivity: sensitivityMultiplier,
          invertY: isInvertedY,
          timestamp: performance.now()
        });
      }
    }
    requestAnimationFrame(runTransmitLoop);
  }

  // ─── Motion Handler (Swing Detection) ───
  function handleMotion(e) {
    if (e.rotationRate) {
      lastRotRate = {
        alpha: e.rotationRate.alpha || 0,
        beta: e.rotationRate.beta || 0,
        gamma: e.rotationRate.gamma || 0
      };
    }

    if (e.acceleration) {
      lastAccel = {
        x: e.acceleration.x || 0,
        y: e.acceleration.y || 0,
        z: e.acceleration.z || 0
      };

      if (currentMode === 'swing') {
        const totalSpeed = Math.abs(lastRotRate.alpha) + Math.abs(lastRotRate.beta) + Math.abs(lastRotRate.gamma);
        const accelMag = Math.hypot(lastAccel.x, lastAccel.y, lastAccel.z);
        const swingActive = totalSpeed > 150 || accelMag > 12;

        if (swingActive !== isSlashing) {
          isSlashing = swingActive;
          if (isSlashing) hapticPulse(15);
          updateTriggerUI();
        }
      }
    }
  }

  function updateSlashState() {
    if (currentMode === 'gyro' || currentMode === 'touch') {
      isSlashing = isTouching;
    }
    updateTriggerUI();
  }

  function updateTriggerUI() {
    if (isSlashing) {
      triggerPad.classList.add('active-slashing');
      triggerTitle.textContent = '⚔️ BLADE ACTIVE';
    } else {
      triggerPad.classList.remove('active-slashing');
      if (currentMode === 'gyro') {
        triggerTitle.textContent = 'Hold to Slice';
      } else if (currentMode === 'touch') {
        triggerTitle.textContent = 'Swipe to Slice';
      } else if (currentMode === 'swing') {
        triggerTitle.textContent = 'Swing Phone to Cut';
      }
    }
  }

  // ─── Actions ───
  function recenterAim() {
    centerBeta = currentBeta;
    centerGamma = currentGamma;
    centerAlpha = currentAlpha;
    hapticPulse(30);
    sendControllerMsg({ type: 'recenter' });
  }

  recenterBtn.addEventListener('click', recenterAim);

  playBtn.addEventListener('click', () => {
    hapticPulse(40);
    sendControllerMsg({ type: 'action', action: 'start_game' });
  });

  // ─── Touchpad Events ───
  triggerPad.addEventListener('touchstart', (e) => {
    e.preventDefault();
    isTouching = true;
    const t = e.touches[0];
    lastTouchPos = { x: t.clientX, y: t.clientY };
    updateSlashState();
    hapticPulse(25);

    sendControllerMsg({ type: 'slash_state', active: true });
    sendControllerMsg({ type: 'touchstart' });
  }, { passive: false });

  triggerPad.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];

    if (lastTouchPos) {
      const dx = (t.clientX - lastTouchPos.x) * sensitivityMultiplier;
      const dy = (t.clientY - lastTouchPos.y) * sensitivityMultiplier;

      if (currentMode === 'touch') {
        sendControllerMsg({ type: 'touchmove', dx, dy });
      }
    }

    lastTouchPos = { x: t.clientX, y: t.clientY };
  }, { passive: false });

  triggerPad.addEventListener('touchend', (e) => {
    e.preventDefault();
    isTouching = false;
    lastTouchPos = null;
    updateSlashState();

    sendControllerMsg({ type: 'slash_state', active: false });
    sendControllerMsg({ type: 'touchend' });
  }, { passive: false });

  triggerPad.addEventListener('touchcancel', (e) => {
    e.preventDefault();
    isTouching = false;
    lastTouchPos = null;
    updateSlashState();

    sendControllerMsg({ type: 'slash_state', active: false });
    sendControllerMsg({ type: 'touchend' });
  }, { passive: false });

  let isInvertedY = false;

  // ─── Mode, Sensitivity & Pitch Selectors ───
  document.querySelectorAll('#modeControl [data-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#modeControl [data-mode]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.getAttribute('data-mode');
      modeBadge.textContent = currentMode.toUpperCase();

      if (currentMode === 'gyro') {
        triggerDesc.textContent = 'Aim by tilting your phone. Hold thumb down to draw blade & cut!';
      } else if (currentMode === 'touch') {
        triggerDesc.textContent = 'Drag your thumb across the pad to swipe and slice fruits directly!';
      } else if (currentMode === 'swing') {
        triggerDesc.textContent = 'Physically swing your phone like a sword through the air!';
      }

      updateSlashState();
      hapticPulse(15);
    });
  });

  document.querySelectorAll('#sensControl [data-sens]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#sensControl [data-sens]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sensitivityMultiplier = parseFloat(btn.getAttribute('data-sens'));
      hapticPulse(15);
    });
  });

  document.querySelectorAll('#invertControl [data-invert]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#invertControl [data-invert]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      isInvertedY = btn.getAttribute('data-invert') === '1';
      hapticPulse(15);
    });
  });

  window.addEventListener('load', () => {
    const isIOS = typeof DeviceOrientationEvent !== 'undefined' &&
                  typeof DeviceOrientationEvent.requestPermission === 'function';
    if (!isIOS) {
      permissionModal.classList.add('hidden');
      attachSensorListeners();
    }
  });
  </script>
</body>
</html>
